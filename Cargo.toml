[workspace]
members = [
    "aerial-core/aerial-engine",
    "araskova-labs/collab-server",
    "src-tauri"
, "aerial-core/aras-dsl", "aerial-core/aras-layout"]
resolver = "2"

# Production builds: whole-program optimisation for the WASM engine, the
# desktop app and the relay. Smaller binaries and faster hot loops.
[profile.release]
lto = true
codegen-units = 1
