[package]
name = "aerial-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "MouseEvent",
    "Node",
    "Path2d",
    "WheelEvent",
    "Window",
    "Performance"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yrs = "0.17"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
