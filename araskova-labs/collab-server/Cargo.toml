[package]
name = "aerial-collab-server"
version = "0.2.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aerial-collab-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
futures-util = "0.3"
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"

[dev-dependencies]
tokio-tungstenite = "0.24"
