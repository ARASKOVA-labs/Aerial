[package]
name = "rustama-engine"
version = "0.1.0"
edition = "2021"
description = "Rustama Engine — local LLM inference core for Araskova products"

[lib]
name = "rustama_engine"
path = "src/lib.rs"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# llama.cpp Rust bindings
llama-cpp-2 = "0.1.150"

# HuggingFace model downloads
reqwest = { version = "0.11", features = ["stream", "json"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
