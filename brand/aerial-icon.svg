<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Aerial app icon: an "A" drawn in one pen stroke; its crossbar is a
       contrail that ends in the Araskova spark. macOS grid: 824px plate. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1b1e" />
      <stop offset="1" stop-color="#0a0a0b" />
    </linearGradient>
    <linearGradient id="trail" x1="236" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e73f07" stop-opacity="0" />
      <stop offset="0.35" stop-color="#e73f07" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ff8a3d" />
    </linearGradient>
    <radialGradient id="halo" cx="790" cy="500" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a1f" stop-opacity="0.7" />
      <stop offset="0.45" stop-color="#e73f07" stop-opacity="0.22" />
      <stop offset="1" stop-color="#e73f07" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#eee9df" stroke-opacity="0.07" stroke-width="3" />
  <!-- the A: one stroke, apex rounded like a pen turn -->
  <path d="M318 748 L486 336 Q512 276 538 336 L706 748" fill="none" stroke="#eee9df" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" />
  <!-- contrail crossbar -->
  <path d="M236 668 C404 650 596 584 790 474 A26 26 0 0 1 790 526 C604 604 410 662 236 668 Z" fill="url(#trail)" />
  <!-- spark -->
  <circle cx="790" cy="500" r="120" fill="url(#halo)" />
  <g stroke="#ffb27a" stroke-width="10" stroke-linecap="round">
    <path d="M745 455 L760 470 M820 530 L835 545 M745 545 L760 530 M820 470 L835 455" />
  </g>
  <circle cx="790" cy="500" r="30" fill="#ff8a3d" />
  <circle cx="790" cy="500" r="14" fill="#fff6ea" />
</svg>
