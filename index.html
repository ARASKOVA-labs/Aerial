<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aerial</title>
    <link rel="preload" href="/fonts/rephen.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Boot screen. Inline so it paints on the first frame, before the JS
         bundle, CSS or WASM arrive; driven by /boot.js (no inline script, CSP). -->
    <style>
      @font-face {
        font-family: 'Rephen';
        src: url('/fonts/rephen.ttf') format('truetype');
        font-display: block;
      }
      html, body { margin: 0; height: 100%; }
      html { background: #ffffff; }
      html[data-boot-theme='dark'] { background: #121212; }
      #aerial-boot {
        --b-bg: #ffffff; --b-ink: #1b1b1f; --b-muted: #8b8b93; --b-track: #ececf1; --b-brand: #e73f07; --b-chev: #ffffff;
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        background: var(--b-bg); color: var(--b-ink);
        font: 500 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.42s;
        -webkit-user-select: none; user-select: none; cursor: progress;
      }
      html[data-boot-theme='dark'] #aerial-boot {
        --b-bg: #121212; --b-ink: #e3e3e8; --b-muted: #7d7d88; --b-track: #2a2a31; --b-chev: #121212;
      }
      #aerial-boot.ab-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .ab-stack {
        display: flex; flex-direction: column; align-items: center;
        transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.42s ease;
      }
      #aerial-boot.ab-done .ab-stack { transform: scale(1.06); filter: blur(2px); }

      /* The mark sketches itself: outline → ink fill → chevron stroke. */
      .ab-mark { width: 72px; height: 72px; overflow: visible; }
      .ab-sq-line {
        fill: none; stroke: var(--b-brand); stroke-width: 1.6; stroke-linecap: round;
        stroke-dasharray: 1 2; stroke-dashoffset: 1;
        animation: ab-draw 0.5s cubic-bezier(0.55, 0.1, 0.3, 1) 0.05s forwards;
      }
      .ab-sq-fill {
        fill: var(--b-brand); opacity: 0; transform-origin: 22px 22px; transform: scale(0.9);
        animation: ab-fill 0.38s cubic-bezier(0.2, 0.9, 0.25, 1.25) 0.42s forwards;
      }
      .ab-chev {
        fill: none; stroke: var(--b-chev); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1 2; stroke-dashoffset: 1;
        animation: ab-draw 0.42s cubic-bezier(0.6, 0, 0.3, 1) 0.62s forwards;
      }
      .ab-word {
        display: flex; gap: 0.3em; margin-top: 22px;
        font: 900 26px/1 Rephen, Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em;
      }
      .ab-word span { opacity: 0; transform: translateY(6px); animation: ab-rise 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .ab-word span:nth-child(1) { animation-delay: 0.70s; }
      .ab-word span:nth-child(2) { animation-delay: 0.75s; }
      .ab-word span:nth-child(3) { animation-delay: 0.80s; }
      .ab-word span:nth-child(4) { animation-delay: 0.85s; }
      .ab-word span:nth-child(5) { animation-delay: 0.90s; }
      .ab-word span:nth-child(6) { animation-delay: 0.95s; }

      /* Real progress: boot.js moves the bar as each phase completes. */
      .ab-bar {
        width: 132px; height: 3px; margin-top: 26px; border-radius: 3px; overflow: hidden;
        background: var(--b-track); opacity: 0; animation: ab-in 0.3s ease 0.5s forwards;
      }
      .ab-bar i {
        display: block; height: 100%; border-radius: inherit; background: var(--b-brand);
        transform-origin: 0 50%; transform: scaleX(0.04);
        transition: transform 1.1s cubic-bezier(0.22, 0.75, 0.25, 1);
      }
      .ab-caption {
        height: 18px; margin-top: 12px; color: var(--b-muted); font-size: 12px; letter-spacing: 0.01em;
        opacity: 0; animation: ab-in 0.3s ease 0.6s forwards; transition: opacity 0.18s ease;
      }
      .ab-caption.ab-swap { opacity: 0 !important; }
      .ab-error .ab-bar i { background: #e03131; }

      @keyframes ab-draw { to { stroke-dashoffset: 0; } }
      @keyframes ab-fill { to { opacity: 1; transform: scale(1); } }
      @keyframes ab-rise { to { opacity: 1; transform: none; } }
      @keyframes ab-in { to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .ab-sq-line, .ab-chev { animation: none; stroke-dashoffset: 0; }
        .ab-sq-fill, .ab-word span, .ab-bar, .ab-caption { animation: none; opacity: 1; transform: none; }
        .ab-bar i { transition-duration: 0.2s; }
        #aerial-boot, .ab-stack { transition-duration: 0.15s; }
        #aerial-boot.ab-done .ab-stack { transform: none; filter: none; }
      }
    </style>
  </head>

  <body>
    <div id="aerial-boot" role="progressbar" aria-label="Loading Aerial" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
      <div class="ab-stack">
        <svg class="ab-mark" viewBox="0 0 44 44" aria-hidden="true">
          <rect class="ab-sq-fill" x="1.5" y="1.5" width="41" height="41" rx="11" />
          <rect class="ab-sq-line" x="1.5" y="1.5" width="41" height="41" rx="11" pathLength="1" />
          <path class="ab-chev" d="M12.6 29.4 L20.2 17.6 Q22 14.9 23.8 17.6 L31.4 29.4" pathLength="1" />
        </svg>
        <div class="ab-word" aria-hidden="true"><span>A</span><span>E</span><span>R</span><span>I</span><span>A</span><span>L</span></div>
        <div class="ab-bar"><i></i></div>
        <div class="ab-caption" aria-live="polite">Warming up the engine…</div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
