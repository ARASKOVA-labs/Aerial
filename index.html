<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aerial</title>
    <!-- Boot screen. Inline so it paints on the first frame, before the JS
         bundle, CSS or WASM arrive; drawn and driven by /boot.js (no inline
         script, CSP). -->
    <style>
      html, body { margin: 0; height: 100%; }
      html { background: #f7f5f0; }
      html[data-boot-theme='dark'] { background: #0a0a0b; }
      #aerial-boot {
        position: fixed; inset: 0; z-index: 2147483000;
        background: #f7f5f0;
        transition: opacity 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.45s;
        -webkit-user-select: none; user-select: none; cursor: progress;
      }
      html[data-boot-theme='dark'] #aerial-boot { background: #0a0a0b; }
      #aerial-boot canvas { display: block; }
      #aerial-boot.ab-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .ab-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) {
        #aerial-boot { transition-duration: 0.15s; }
      }
    </style>
  </head>

  <body>
    <div id="aerial-boot" role="progressbar" aria-label="Loading Aerial" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6" data-version="%VITE_APP_VERSION%">
      <canvas aria-hidden="true"></canvas>
      <span class="ab-live" aria-live="polite">Starting</span>
    </div>
    <div id="root"></div>
    <script src="/boot-wordmark.js"></script>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
