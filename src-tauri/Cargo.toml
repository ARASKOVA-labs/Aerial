[package]
name = "aerial"
version = "1.1.0"
description = "High-performance open-source digital whiteboard and canvas"
authors = ["Araskova Labs <dev@araskova.com>"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerial"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
redb = "2.1.1"
uuid = { version = "1.8", features = ["v4"] }
yrs = "0.17"
aras-dsl = { version = "0.1.0", path = "../aerial-core/aras-dsl" }
aras-layout = { version = "0.1.0", path = "../aerial-core/aras-layout" }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
base64 = "0.22.1"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

[features]
default = ["custom-protocol"]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
