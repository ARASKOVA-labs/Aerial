[package]
name = "aerial"
version = "1.0.0"
description = "High-performance open-source digital whiteboard and canvas"
authors = ["Araskova Labs <dev@araskova.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "http-all", "fs-all", "dialog-all", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
redb = "2.1.1"
uuid = { version = "1.8", features = ["v4"] }
yrs = "0.17"
aras-dsl = { version = "0.1.0", path = "../aerial-core/aras-dsl" }
aras-layout = { version = "0.1.0", path = "../aerial-core/aras-layout" }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
base64 = "0.22.1"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
